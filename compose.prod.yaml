# Production stack (#18): Postgres + backend + frontend behind a single
# public entry point (Caddy, auto TLS). Secrets and config come from the
# environment — run from the repo root with:
#
#   cp .env.production.example .env.production   # then fill in the values
#   docker compose --env-file .env.production -f compose.prod.yaml up -d
#
# Only Caddy publishes ports (80/443). Backend and frontend are reachable
# only through the proxy, so API and media URLs are same-origin. SITE_URL is
# the single origin knob: the backend's gateway-return and media URLs are
# derived from it, and it is passed to the frontend as a build arg so the
# baked robots.txt matches (a domain change means rebuilding). See
# docs/deploy.md and docs/adr/0005-deploy.md.

name: theia-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: theia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://theia:${POSTGRES_PASSWORD}@postgres:5432/theia
      DATABASE_URL_SYNC: postgresql://theia:${POSTGRES_PASSWORD}@postgres:5432/theia
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}
      FRONTEND_URL: ${SITE_URL}
      BANCARD_PUBLIC_KEY: ${BANCARD_PUBLIC_KEY:-}
      BANCARD_PRIVATE_KEY: ${BANCARD_PRIVATE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-td.phakos@gmail.com}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      NOTIFICATION_WHATSAPP_TO: ${NOTIFICATION_WHATSAPP_TO:-595971282908}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_URL: ${SITE_URL}
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL}
    environment:
      BACKEND_URL: http://backend:8000
      SITE_URL: ${SITE_URL}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
