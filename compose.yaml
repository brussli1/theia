# Development database. Start it with `docker compose up -d`; the app itself
# runs on the host with `npm run dev`. Production uses compose.prod.yaml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: theia
      POSTGRES_PASSWORD: theia
      POSTGRES_DB: theia_site
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theia -d theia_site"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
